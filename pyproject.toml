[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-elastemp"
dynamic = ["version"]
description = "A LangGraph + Claude agent for the elastemp temperature-dependent elastic constants workflow"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Karthik Balasubramanian" }]
requires-python = ">=3.10"
keywords = ["elastemp", "agent", "LangGraph", "Claude", "elastic constants", "VASP", "phonopy", "materials science"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "elastemp>=0.2.2,<0.3",
    "langgraph>=1.0",
    "langchain-anthropic>=1.0",
]

[project.optional-dependencies]
test = ["pytest>=7"]
dev = ["pytest>=7", "build", "twine", "ruff"]

[project.scripts]
elastemp-agent = "agentic_elastemp.cli:main"

[project.urls]
Homepage = "https://github.com/Karthik-Balas/agentic-elastemp"
Source = "https://github.com/Karthik-Balas/agentic-elastemp"
Issues = "https://github.com/Karthik-Balas/agentic-elastemp/issues"
elastemp = "https://github.com/Karthik-Balas/elastemp"

[tool.setuptools.dynamic]
version = { attr = "agentic_elastemp.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
